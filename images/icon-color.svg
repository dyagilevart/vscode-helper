<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2748"/>
      <stop offset="55%" stop-color="#121c38"/>
      <stop offset="100%" stop-color="#0d152b"/>
    </linearGradient>
    <!-- Same centered ember as the previous “огонёк only” icon -->
    <radialGradient id="halo" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#f0c45c" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#d49a3c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d49a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="48%" r="18%">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="45%" stop-color="#ffe7b0"/>
      <stop offset="100%" stop-color="#f0c45c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wandFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe0c4"/>
      <stop offset="40%" stop-color="#c9a572"/>
      <stop offset="100%" stop-color="#8d6a42"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Original tile + centered light -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bg)"/>

  <circle cx="256" cy="250" r="168" fill="url(#halo)"/>
  <circle cx="256" cy="250" r="78" fill="#ffd98a" opacity="0.35" filter="url(#soft)"/>
  <circle cx="256" cy="250" r="42" fill="url(#core)"/>
  <circle cx="256" cy="250" r="18" fill="#fffaf0"/>

  <circle cx="168" cy="168" r="5" fill="#ffe6a8" opacity="0.75"/>
  <circle cx="348" cy="156" r="4" fill="#ffe6a8" opacity="0.6"/>
  <circle cx="372" cy="312" r="3.5" fill="#ffd98a" opacity="0.55"/>
  <circle cx="152" cy="330" r="3" fill="#ffd98a" opacity="0.45"/>
  <circle cx="268" cy="128" r="3" fill="#fff6d8" opacity="0.5"/>

  <!--
    Wand added on top of the original light.
    Tip enters the core; dark outline keeps shaft readable over gold.
  -->
  <g transform="translate(256 250) rotate(48)">
    <rect x="-13" y="6" width="26" height="198" rx="13" fill="#070d1c"/>
    <rect x="-8" y="10" width="16" height="190" rx="8" fill="url(#wandFill)"/>
    <!-- Tip nestled into the ember -->
    <rect x="-11" y="-2" width="22" height="22" rx="8" fill="#070d1c"/>
    <rect x="-7" y="1" width="14" height="14" rx="5" fill="#fff8e6"/>
    <!-- Handle rings -->
    <rect x="-11" y="132" width="22" height="10" rx="4" fill="#070d1c"/>
    <rect x="-8" y="134" width="16" height="6" rx="3" fill="#5f452c"/>
    <rect x="-11" y="152" width="22" height="10" rx="4" fill="#070d1c"/>
    <rect x="-8" y="154" width="16" height="6" rx="3" fill="#5f452c"/>
    <!-- Pommel -->
    <circle cx="0" cy="202" r="14" fill="#070d1c"/>
    <circle cx="0" cy="202" r="9" fill="#8d6a42"/>
  </g>
</svg>
